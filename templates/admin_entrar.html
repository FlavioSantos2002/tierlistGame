{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Painel do admin</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post" class="cartao">
  <input type="hidden" name="csrf_token" value="{{ token_csrf() }}">
  <label for="token">Token do admin</label>
  <input type="password" id="token" name="token" required autofocus autocomplete="current-password">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
